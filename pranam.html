<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-lang-key="pranam"></title>
    <link
      rel="stylesheet"
      href="./assets/fontawesome/css/fontawesome.min.css"
    />
    <link
      rel="stylesheet"
      href="./assets/fontawesome/css/solid.min.css"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <style>
      body{
         background-image: url("../assets/image/background-image.png");
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        background-attachment: fixed;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* =========================
         Language toggle — ported from gyanpanchami's #langSelect (radio pill)
         ========================= */

      #langSelect {
        position: absolute;
        top: 2.8vw;
        right: 4vw;
        z-index: 999999;
      }

      #language {
        background-color: transparent;
        border: 0.21vw solid #fff;
        border-radius: 50vw;
        box-shadow: 0 0.2vw 0.1vw rgba(0, 0, 0, 0.25);
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: space-evenly;
        height: 3.39vw;
        padding: 0 0.4vw;
      }

      #language label {
        cursor: pointer;
        padding: 0.15vw;
        display: flex !important;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
      }

      #language label input {
        display: none;
      }

      #language label span {
        width: 2.375vw;
        aspect-ratio: 1;
        box-sizing: border-box;
        border: 0.21vw solid white;
        overflow: hidden;
        font-size: 1.6vw;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        color: white;
        background: #802922;
      }

      #language input:checked + span {
        background: #fff;
        color: #802922;
        border-color: #ffd35a;
      }
    </style>
  </head>
  <body>
    <a href="bhaav-puja.html" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
   <div id="langSelect">
      <div id="language">
        <label><input type="radio" name="lang" id="en" value="English">
          <span>E</span>
        </label>
        <label><input type="radio" name="lang" id="hi" value="Hindi">
          <span>H</span>
        </label>
        <label><input type="radio" name="lang" id="gu" value="Gujarati">
          <span>G</span>
        </label>
      </div>
    </div>
    <div class="pranam-container">
      <div class="pranam-img">
        
<div class="pranam-video">
          <video src="./assets/video/pranam.mp4" autoplay muted></video>
        </div>
        <span data-lang-key="pranam"></span>
        <img src="./assets/image/pranam-img.png" alt="" />
      </div>
      <a href="index.html" class="home-btn-1">
        <span data-lang-key="home"></span>
        <img src="./assets/image/home-btn-1.png" alt="" />
      </a>
    </div>
    <script src="./assets/js/app.js"></script>

    <script>
      // click sound effects
      const backBtnClickSound = new Audio("./assets/audio/pop.mp3");
      const homeBtn1ClickSound = new Audio("./assets/audio/11.mp3");

      function playClickSound(audio) {
        audio.currentTime = 0;
        audio.play().catch(function (err) {
          console.error("Error playing click sound:", err);
        });
      }

      function navigateWithSound(link, audio, delay) {
        link.addEventListener("click", function (e) {
          e.preventDefault();

          const destination = link.getAttribute("href");

          playClickSound(audio);

          setTimeout(function () {
            window.location.href = destination;
          }, delay);
        });
      }

      // play pranam.mp3 once on page load only
      window.addEventListener("DOMContentLoaded", function () {
        const pranamAudio = new Audio("./assets/audio/pranam.mp3");
        pranamAudio.play().catch(function (err) {
          console.error("Error playing pranam audio:", err);
        });
      });

      const backBtn = document.querySelector(".back-btn");
      const homeBtn1 = document.querySelector(".home-btn-1");

      if (backBtn) {
        navigateWithSound(backBtn, backBtnClickSound, 1000);
      }

      if (homeBtn1) {
        navigateWithSound(homeBtn1, homeBtn1ClickSound, 1000);
      }

    </script>
    <script src="./js/data.js"></script>
    <script src="./js/script.js"></script>
        <script src="./js/djp.js"></script>
  </body>
</html>
