<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bhaav-puja</title>
    <link rel="stylesheet" href="css/types-of-puja.css" />
    <link
      rel="stylesheet"
      href="./css/swiper-bundle.min.css"
    />
    <style>
      .main-page {
        height: 100vh;
        width: 100%;
        position: relative;
        overflow: hidden;
        background-image: url("../assets/image/background-image.png");
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        background-attachment: fixed;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "BalooRegular";
      }

      .pranam-link {
        position: absolute;
        display: flex;
        justify-content: center;
        align-items: center;
        right: 4vw;
        bottom: 4vw;
        width: 9vw;
        height: auto;
        text-decoration: none;
        z-index: 9999;
        pointer-events: none;
        cursor: pointer;
        animation: pranamPop 1.2s ease-in-out infinite;
        transform-origin: center;

        /* hidden by default — only appears on last slide */
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.4s ease;
      }

      .pranam-link img {
        position: relative;
        width: 100%;
        display: block;
        object-fit: contain;
      }

      .pranam-link span {
        position: absolute;
        text-decoration: none;
        color: white;
        font-weight: bold;
        font-size: 1.3vw;
        padding-right: 1vw;
        font-family: "BalooRegular";
      }

      @keyframes pranamPop {
        0% {
          transform: scale(1);
        }

        50% {
          transform: scale(1.12);
        }

        100% {
          transform: scale(1);
        }
      }

      .pranam-link.show {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }
    </style>
  </head>
  <body>

     <a href="pranam.html" class="pranam-link">
      <img src="./assets/image/arowAsset.png" alt="" />
      <span data-lang-key="pranam"></span>
    </a>
    <div class="main-page">
      <div class="page-load">
        <img class="" src="./assets/image/circle-img.png" alt="" />
        <div class="page-load-title">
          <span data-lang-key="type-3">Bhaav Puja</span>
        </div>
      </div>

      <nav>
        <div class="home-btn">
          <a href="index.html">
            <img src="./assets/image/home-img.png" alt="" />
          </a>
        </div>

        <div class="title-1">
          <div class="outer">
            <h1 data-lang-key="type-3">Bhaav Puja</h1>
          </div>
        </div>

        <div class="nav-lang-container">
          <div class="nav-btn english">E</div>
          <div class="nav-btn hindi">H</div>
          <div class="nav-btn gujrati">G</div>
        </div>

        <div class="moving-circle"></div>
      </nav>

      <main>
        <div class="container">
          <div class="circle-container">
            <div class="circle rounded-circle-1">
              <a href="anga-puja.html">
                <img class="" src="./assets/image/circle-img.png" alt="" />
                <div class="circle-content">
                  <span data-lang-key="type-1">Anga Puja</span>
                </div>
              </a>
            </div>

            <div class="circle rounded-circle-1">
              <a href="agra-puja.html">
                <img src="./assets/image/circle-img.png" alt="" />
                <div class="circle-content">
                  <span data-lang-key="type-2">Agra Puja</span>
                </div>
              </a>
            </div>

            <div class="circle rounded-circle-1">
              <a href="bhaav-puja.html">
                <img src="./assets/image/circle-img.png" alt="" />
                <div class="circle-content">
                  <span data-lang-key="type-3">Bhaav Puja</span>
                </div>
              </a>
            </div>
          </div>

          <div class="swiper pujaSwiper">
            <div class="swiper-wrapper">
              <!-- slide-1  -->
              <div class="swiper-slide">
                <div class="swiper-slides-images">
                  <img
                    class="swiper-slide-img-1"
                    src="./assets/image/swiper-img.png"
                    alt=""
                  />
                  <img
                    class="swiper-slide-img-2"
                    src="./assets/image/swiper-img-1.png"
                    alt=""
                  />
                  <div class="wrap">
                    <div class="video-mask">
                      <video
                        class="frame-video"
                        src="./assets/video/bhaav-puja/slide-3.1.mp4"
                        autoplay
                        muted
                        loop
                        playsinline
                      ></video>
                    </div>
                    <div class="swiper-content">
                      <span data-lang-key="slide-3.1"></span>
                    </div>
                  </div>
                </div>
              </div>
              <!-- slide-2  -->
              <div class="swiper-slide">
                <div class="swiper-slides-images">
                  <img
                    class="swiper-slide-img-1"
                    src="./assets/image/swiper-img.png"
                    alt=""
                  />
                  <img
                    class="swiper-slide-img-2"
                    src="./assets/image/swiper-img-1.png"
                    alt=""
                  />
                  <div class="wrap">
                    <div class="video-mask">
                      <video
                        class="frame-video"
                        src="./assets/video/bhaav-puja/slide-3.2.mp4"
                        autoplay
                        muted
                        loop
                        playsinline
                      ></video>
                    </div>
                    <div class="swiper-content">
                      <span data-lang-key="slide-3.2"></span>
                    </div>
                  </div>
                </div>
              </div> 

            </div>

            <div class="navigations">
              <div class="prev-btn">
                <img src="./assets/image/left-navigation.png" alt="Previous" />
              </div>
              <div class="swiper-pagination"></div>
              <div class="next-btn">
                <img src="./assets/image/right-navigation.png" alt="Next" />
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="./js/swiper-bundle.min.js"></script>
    <script src="./js/types-of-puja.js"></script>

    <script>
      // Show .pranam-link only on the last swiper slide.
      // Swiper attaches its instance to the container element as `.swiper`
      // once initialized (Swiper 6+). Since your init happens inside
      // types-of-puja.js and possibly waits on DOMContentLoaded, we poll
      // briefly until the instance exists, then hook into it.
      (function watchForLastSlide() {
        const pranamLink = document.querySelector(".pranam-link");
        const swiperEl = document.querySelector(".pujaSwiper");

        function bindToSwiper(swiperInstance) {
          function updatePranamVisibility() {
            if (swiperInstance.isEnd) {
              pranamLink.classList.add("show");
            } else {
              pranamLink.classList.remove("show");
            }
          }

          // check initial state (in case it loads already on last slide)
          updatePranamVisibility();

          swiperInstance.on("slideChange", updatePranamVisibility);
          swiperInstance.on("reachEnd", updatePranamVisibility);
          swiperInstance.on("fromEdge", updatePranamVisibility);
        }

        let attempts = 0;
        const maxAttempts = 50; // ~5s at 100ms intervals

        const poll = setInterval(() => {
          attempts++;

          if (swiperEl && swiperEl.swiper) {
            clearInterval(poll);
            bindToSwiper(swiperEl.swiper);
          } else if (attempts >= maxAttempts) {
            clearInterval(poll);
            console.warn(
              "pranam-link: could not find an initialized Swiper instance on .pujaSwiper"
            );
          }
        }, 100);
      })();
    </script>

    <script>
      // =========================
      // audio elements
      // =========================
      const transitionAudio = new Audio("./assets/audio/transition.mp3");
      const circleClickSound = new Audio("./assets/audio/11.mp3");
      const swipeClickSound = new Audio("./assets/audio/swipe.mp3");
      const popClickSound = new Audio("./assets/audio/pop.mp3");

      function playSound(audio) {
        if (!audio) return;
        audio.currentTime = 0;
        audio.play().catch(function (err) {
          console.error("Error playing audio:", err);
        });
      }

      // play transition.mp3 once on page load
      window.addEventListener("DOMContentLoaded", function () {
        playSound(transitionAudio);
      });

      // circle links: play 11.mp3, then navigate after a short delay
      const circleLinks = document.querySelectorAll(".circle-container .circle a");

      circleLinks.forEach((link) => {
        link.addEventListener("click", function (e) {
          e.preventDefault();

          const destination = link.getAttribute("href");

          playSound(circleClickSound);

          setTimeout(function () {
            window.location.href = destination;
          }, 600);
        });
      });

      // swiper prev/next buttons: play swipe.mp3
      const prevBtn = document.querySelector(".navigations .prev-btn");
      const nextBtn = document.querySelector(".navigations .next-btn");

      prevBtn?.addEventListener("click", function () {
        playSound(swipeClickSound);
      });

      nextBtn?.addEventListener("click", function () {
        playSound(swipeClickSound);
      });

      // home button: play pop.mp3, then navigate after a short delay
      const homeBtnLink = document.querySelector(".home-btn a");

      homeBtnLink?.addEventListener("click", function (e) {
        e.preventDefault();

        const destination = homeBtnLink.getAttribute("href");

        playSound(popClickSound);

        setTimeout(function () {
          window.location.href = destination;
        }, 600);
      });
    </script>
  </body>
</html>
