<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-lang-key="pranam"></title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <style>
      body{
         background-image: url("../assets/image/background-image.png");
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        background-attachment: fixed;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* =========================
         Language Buttons
         ========================= */

      .nav-lang-container {
        position: absolute;
        width: 8.5vw;
        height: 3vw;
        display: flex;
        top: 2.8vw;
        right: 4vw;
        justify-content: space-between;
        align-items: center;
        pointer-events: auto;
        z-index: 10;
      }

      .nav-lang-container .nav-btn {
        width: 2.2vw;
        height: 2.2vw;
        font-family: "BalooRegular";
        text-align: center;
        border-radius: 50%;
        z-index: 11;
        border: 0.2vw solid var(--text, #9A3227);
        padding: 0.5vw;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 2vw;
        color: var(--text, #9A3227);
        opacity: 0.6;
        cursor: pointer !important;
        transition: transform 250ms ease, opacity 250ms ease, background-color 0.8s ease;
        transform: scale(1);
        background-color: transparent;
      }

      .nav-lang-container .nav-btn.active {
        display: flex;
        justify-content: center;
        align-items: center !important;
        opacity: 1;
        transform: scale(1.15);
        background-color: var(--primary, #FFF8B3);
      }

      /* =========================
         Moving Circle
         ========================= */

      .moving-circle {
        position: absolute;
        pointer-events: none;
        top: 0vw!important;
        right: 5.5vw!important;
        z-index: 0;
        width: 3vw;
        height: 3vw;
        border: 0.15vw solid var(--text, #9A3227);
        border-radius: 50%;
        transition: transform 300ms ease;
      }

      @keyframes jiggleX {
        0%   { transform: translate(var(--x, 0px), var(--y, 0px)) translateX(0); }
        25%  { transform: translate(var(--x, 0px), var(--y, 0px)) translateX(-0.6vw); }
        50%  { transform: translate(var(--x, 0px), var(--y, 0px)) translateX(0.6vw); }
        75%  { transform: translate(var(--x, 0px), var(--y, 0px)) translateX(-0.3vw); }
        90%  { transform: translate(var(--x, 0px), var(--y, 0px)) translateX(0.3vw); }
        100% { transform: translate(var(--x, 0px), var(--y, 0px)) translateX(0); }
      }

      .moving-circle.jiggle {
        animation: jiggleX 0.9s ease-in-out 1;
      }
    </style>
  </head>
  <body>
    <a href="bhaav-puja.html" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
   <div class="nav-lang-container">
          <div class="nav-btn english active">E</div>
          <div class="nav-btn hindi">H</div>
          <div class="nav-btn gujrati">G</div>
          <div class="moving-circle"></div>
        </div>
    <div class="pranam-container">
      <div class="pranam-img">
        
<div class="pranam-video">
          <video src="./assets/video/pranam.mp4" autoplay muted></video>
        </div>
        <span data-lang-key="pranam"></span>
        <img src="./assets/image/pranam-img.png" alt="" />
      </div>
      <a href="index.html" class="home-btn-1">
        <span data-lang-key="home"></span>
        <img src="./assets/image/home-btn-1.png" alt="" />
      </a>
    </div>
    <script src="./assets/js/app.js"></script>

    <script>
      // click sound effects
      const backBtnClickSound = new Audio("./assets/audio/pop.mp3");
      const homeBtn1ClickSound = new Audio("./assets/audio/11.mp3");

      // language voice-over audio
      const engAudio = new Audio("./assets/audio/Eng.mpeg");
      const hinAudio = new Audio("./assets/audio/Hin.mpeg");
      const gujAudio = new Audio("./assets/audio/Guj.mpeg");

      function playClickSound(audio) {
        audio.currentTime = 0;
        audio.play().catch(function (err) {
          console.error("Error playing click sound:", err);
        });
      }

      function navigateWithSound(link, audio, delay) {
        link.addEventListener("click", function (e) {
          e.preventDefault();

          const destination = link.getAttribute("href");

          playClickSound(audio);

          setTimeout(function () {
            window.location.href = destination;
          }, delay);
        });
      }

      // play pranam.mp3 once on page load only
      window.addEventListener("DOMContentLoaded", function () {
        const pranamAudio = new Audio("./assets/audio/pranam.mp3");
        pranamAudio.play().catch(function (err) {
          console.error("Error playing pranam audio:", err);
        });
      });

      const backBtn = document.querySelector(".back-btn");
      const homeBtn1 = document.querySelector(".home-btn-1");

      if (backBtn) {
        navigateWithSound(backBtn, backBtnClickSound, 1000);
      }

      if (homeBtn1) {
        navigateWithSound(homeBtn1, homeBtn1ClickSound, 1000);
      }

      // language buttons
      const englishBtn = document.querySelector(".nav-lang-container .english");
      const hindiBtn = document.querySelector(".nav-lang-container .hindi");
      const gujratiBtn = document.querySelector(".nav-lang-container .gujrati");
      const movingCircle = document.querySelector(".moving-circle");

      const langButtons = [englishBtn, hindiBtn, gujratiBtn];

      function playAudio(audio) {
        if (!audio) return;
        audio.currentTime = 0;
        audio.play().catch(function (err) {
          console.error("Error playing language audio:", err);
        });
      }

      function setActiveLangBtn(activeBtn) {
        langButtons.forEach((btn) => {
          if (btn) btn.classList.remove("active");
        });

        if (activeBtn) activeBtn.classList.add("active");
      }

      function triggerJiggle() {
        if (!movingCircle) return;
        movingCircle.classList.remove("jiggle");
        void movingCircle.offsetWidth; // restart animation
        movingCircle.classList.add("jiggle");
      }

      englishBtn?.addEventListener("click", () => {
        setActiveLangBtn(englishBtn);
        playAudio(engAudio);
        triggerJiggle();
      });

      hindiBtn?.addEventListener("click", () => {
        setActiveLangBtn(hindiBtn);
        playAudio(hinAudio);
        triggerJiggle();
      });

      gujratiBtn?.addEventListener("click", () => {
        setActiveLangBtn(gujratiBtn);
        playAudio(gujAudio);
        triggerJiggle();
      });
    </script>
    <script src="./js/script.js"></script>
        <script src="./js/djp.js"></script>
  </body>
</html>
